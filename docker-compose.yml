version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: campusx-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - campusx-mongo-data:/data/db
    networks:
      - campusx-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusx-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/campusx
      - JWT_SECRET=campusx_secret_key_2026_super_secure
      - ALLOWED_EMAIL_DOMAINS=lpu.in,university.edu,campusx.edu,iit.ac.in,nit.ac.in
      - RAZORPAY_KEY_ID=
      - RAZORPAY_KEY_SECRET=
    depends_on:
      - mongodb
    networks:
      - campusx-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: campusx-ml
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/campusx
      - PORT=8000
    depends_on:
      - mongodb
    networks:
      - campusx-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusx-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
      - ml-service
    networks:
      - campusx-net

volumes:
  campusx-mongo-data:

networks:
  campusx-net:
    driver: bridge

